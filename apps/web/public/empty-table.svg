<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="120" height="100">
  <!-- The empty-table picture (Aryan, 26 Nov): the same receipt as no-results.tsx's NoInvoicesArt,
       as a file so a style rule can put it above every empty table's message (styles.css). It
       moves gently, and stands still for people who turn motion off. -->
  <style>
    * { transform-box: fill-box; transform-origin: center; }
    .paper { animation: float 3.4s ease-in-out infinite; }
    .shadow { animation: shadow 3.4s ease-in-out infinite; }
    .coin { animation: coin 2.8s ease-in-out infinite; }
    .spark { animation: spark 2.2s ease-in-out infinite; }
    .spark2 { animation-delay: 1.1s; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes shadow { 0%, 100% { transform: scaleX(1); opacity: 1; } 50% { transform: scaleX(0.86); opacity: 0.7; } }
    @keyframes coin { 0%, 100% { transform: translateY(0) scaleX(1); } 25% { transform: translateY(-5px) scaleX(0.15); } 50% { transform: translateY(-7px) scaleX(1); } 75% { transform: translateY(-3px) scaleX(0.15); } }
    @keyframes spark { 0%, 100% { opacity: 0.25; transform: scale(0.6); } 50% { opacity: 1; transform: scale(1.15); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <ellipse class="shadow" cx="54" cy="93" rx="30" ry="4.5" fill="#dbe6fb" />
  <g class="paper">
    <path d="M30 12h48a5 5 0 0 1 5 5v67l-5.8-4-5.8 4-5.8-4-5.8 4-5.8-4-5.8 4-5.8-4-5.8 4-5.8-4-5.8 4V17a5 5 0 0 1 5-5z" fill="#ffffff" stroke="#1f2937" stroke-width="1.6" stroke-linejoin="round" />
    <rect x="35" y="22" width="22" height="5" rx="2.5" fill="#1d9fda" />
    <rect x="35" y="34" width="38" height="4" rx="2" fill="#dbe6fb" />
    <rect x="35" y="43" width="30" height="4" rx="2" fill="#dbe6fb" />
    <rect x="35" y="52" width="34" height="4" rx="2" fill="#dbe6fb" />
    <path d="M35 63h38" stroke="#dbe6fb" stroke-width="2" stroke-dasharray="3 3" />
    <rect x="55" y="68" width="18" height="5" rx="2.5" fill="#e8f6fc" />
  </g>
  <g class="coin">
    <circle cx="92" cy="30" r="13" fill="#fbbc05" stroke="#e0a400" stroke-width="1.6" />
    <text x="92" y="35.5" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff" font-family="system-ui, sans-serif">₱</text>
  </g>
  <path class="spark" d="M17 30l1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6z" fill="#93b4f5" />
  <path class="spark spark2" d="M98 62l1.2 3 3 1.2-3 1.2-1.2 3-1.2-3-3-1.2 3-1.2z" fill="#34a853" />
</svg>
