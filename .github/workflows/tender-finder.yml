# The tender finder's robot (docs/PLAN.md 24, workers/tender-finder): every hour of the working day
# it opens the public PhilGEPS list of medicine tenders in a browser, reads the new notices and
# hands them to the CRM, where the bidding team sees them under Tenders → Tender finder.
#
# Then, for the notices the team screened, it gets the tender papers with the company's PhilGEPS
# log-in and reads them (see the last step).
#
# It runs here, on GitHub's computers, so no office PC has to stay on and no server has to carry
# a browser. Who it is: GitHub signs a short-lived token for this workflow ("id-token"), and the
# CRM's door (/webhooks/tender-finder) lets in only this workflow on this repository's main
# branch (apps/api/src/tenders/robot-caller.ts): for the CRM there is no secret to set or to leak.
# The only secrets are the PhilGEPS log-in for the papers, which GitHub hides in every log.

name: Tender finder

on:
  schedule:
    - cron: "7 22,23,0-9 * * *" # every hour from 6:07 am to 5:07 pm Manila
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workers/tender-finder/**"
      - ".github/workflows/tender-finder.yml"
      # How the CRM reads what the robot hands in: after a change the notices are read again.
      - "apps/api/src/tenders/finder.ts"

concurrency:
  group: tender-finder
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  find:
    name: Read PhilGEPS and hand in to the CRM
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: workers/tender-finder
    env:
      CRM_URL: https://crmnew-api.onrender.com
    steps:
      - uses: actions/checkout@v5
      # The repository's root names pnpm for the CRM; the robot is a plain npm folder of its own,
      # so Node's set-up must not look for pnpm's cache here.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Keep Chrome between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ hashFiles('workers/tender-finder/package-lock.json') }}
      # What the paper reader has read of long scans so far, so the next run goes on from there.
      - name: Keep the scans' reading between runs
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/papers-cache
          key: papers-${{ github.run_id }}
          restore-keys: papers-
      - name: Install (Puppeteer, the paper reader)
        run: npm ci --no-audit --no-fund
      - name: Chrome for Puppeteer (when the install did not bring it)
        run: npx puppeteer browsers install chrome
      - name: Let Chrome keep its sandbox on this runner
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      - name: The readings still read right
        run: npm test
      # A deploy of the CRM restarts its server for a minute or two; 401 = the door is there. A run
      # set off by a change (to the robot, or to how the CRM reads what it hands in) also waits
      # until the CRM runs that very change (its health answer names its commit), ten minutes at most.
      - name: Wait for the CRM's door
        env:
          WANTED: ${{ github.event_name == 'push' && github.sha || '' }}
        run: |
          for try in $(seq 1 60); do
            code=$(curl -s -o /dev/null -m 60 -w "%{http_code}" "$CRM_URL/webhooks/tender-finder/molecules" || true)
            running=$(curl -s -m 60 "$CRM_URL/api/health" | sed -n 's/.*"commit":"\([0-9a-f]*\)".*/\1/p' || true)
            if [ "$code" = "401" ] && { [ -z "$WANTED" ] || [ "$running" = "$WANTED" ]; }; then exit 0; fi
            echo "The door answers $code, the CRM runs ${running:-an unnamed commit}; trying again in 10 s"
            sleep 10
          done
          if [ "$code" = "401" ]; then echo "Going on with the code the CRM runs now"; exit 0; fi
          echo "The CRM's door did not open"
          exit 1
      # While the bidding team's own system moves into the CRM (docs/PLAN.md 25), what it holds is
      # handed over every hour: its tenders on both portals, what it read in their papers, what the
      # team screened there. It is only read. Two repository secrets say where it is
      # (BIDDING_SUPABASE_URL) and let it be read (BIDDING_SUPABASE_KEY); with none set this step
      # does nothing. A problem here never stops the CRM's own reading below.
      - name: The bidding system's own tenders (handed over while it moves in)
        continue-on-error: true
        env:
          BIDDING_SUPABASE_URL: ${{ secrets.BIDDING_SUPABASE_URL }}
          BIDDING_SUPABASE_KEY: ${{ secrets.BIDDING_SUPABASE_KEY }}
        run: node feed/feed.mjs
      # Started by hand or by a change to the robot: a look at the first page before the real run.
      - name: First page only, nothing sent
        if: github.event_name != 'schedule'
        run: node scraper.js --dry-run
      - name: Read PhilGEPS and hand in to the CRM
        run: node scraper.js --trigger=${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
      # The papers of the notices the team screened (papers/papers.mjs): logs in to PhilGEPS with the
      # company's account, orders each one's bid documents at no cost (never pays), downloads, logs
      # out, reads them. The log-in is two repository secrets (Settings > Secrets and variables >
      # Actions): PHILGEPS_USERNAME and PHILGEPS_PASSWORD. With none set this step logs in nowhere.
      - name: The papers of the screened tenders
        env:
          PHILGEPS_USERNAME: ${{ secrets.PHILGEPS_USERNAME }}
          PHILGEPS_PASSWORD: ${{ secrets.PHILGEPS_PASSWORD }}
          PAPERS_CACHE_DIR: ${{ runner.temp }}/papers-cache
        run: node papers/papers.mjs
