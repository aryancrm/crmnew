# The CRM on one server with plain docker compose (for Coolify see docs/DEPLOY-COOLIFY.md):
#   cp apps/api/.env.production.example .env   then fill it in; with this file's own database:
#   DATABASE_URL=postgres://crm:<POSTGRES_PASSWORD>@db:5432/crm
#   docker compose up -d --build
# The web app listens on WEB_PORT (default 8080); put the server's HTTPS proxy in front of it.
# The API and the database are not published: the web app's nginx reaches the API as api:4100.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    # Node as PID 1 ignores SIGTERM; tini passes it on so stops are quick and clean.
    init: true
    environment:
      PORT: 4100
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_UPSTREAM: http://api:4100
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
